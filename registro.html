<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Crea tu cuenta en TecnoShop." />
  <title>Registrarse | TecnoShop</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Google Identity Services (registrarse con Google) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body data-page="registro">
  <div data-include="header"></div>

  <main class="container">
    <div class="auth-wrap">
      <form class="auth-card" id="registroForm" novalidate>
        <h1>Crear Cuenta</h1>
        <p class="sub">Únete a TecnoShop en segundos</p>

        <div class="field">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Tu nombre" />
          <span class="error" id="errNombre"></span>
        </div>

        <div class="field">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" placeholder="Tu apellido" />
          <span class="error" id="errApellido"></span>
        </div>

        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="tucorreo@ejemplo.com" />
          <span class="error" id="errEmail"></span>
        </div>

        <div class="field">
          <label for="telefono">Número de teléfono</label>
          <input type="tel" id="telefono" placeholder="+56 9 1234 5678" />
          <span class="error" id="errTel"></span>
        </div>

        <div class="field">
          <label for="password">Crear contraseña</label>
          <input type="password" id="password" placeholder="Mínimo 6 caracteres" />
          <span class="error" id="errPass"></span>
        </div>

        <div class="field">
          <label for="password2">Repetir contraseña</label>
          <input type="password" id="password2" placeholder="Repite tu contraseña" />
          <span class="error" id="errPass2"></span>
        </div>

        <button type="submit" class="btn btn--primary btn--block">Registrarse</button>

        <div class="auth-divider"><span>o</span></div>
        <div id="googleBtn" class="google-btn"></div>

        <p class="auth-foot">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
      </form>
    </div>
  </main>

  <div data-include="footer"></div>

  <script src="js/products.js"></script>
  <script src="js/store.js"></script>
  <script src="js/google-auth.js"></script>
  <script>
    document.getElementById("registroForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const v = (id) => document.getElementById(id).value.trim();
      const setErr = (id, msg) => (document.getElementById(id).textContent = msg);
      let ok = true;

      setErr("errNombre", ""); setErr("errApellido", ""); setErr("errEmail", "");
      setErr("errPass", ""); setErr("errPass2", "");
      setErr("errTel", "");

      if (v("nombre") === "") { setErr("errNombre", "Ingresa tu nombre."); ok = false; }
      if (v("apellido") === "") { setErr("errApellido", "Ingresa tu apellido."); ok = false; }

      const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRe.test(v("email"))) { setErr("errEmail", "Correo no válido."); ok = false; }

      const telDigits = v("telefono").replace(/\D/g, "");
      if (telDigits.length < 8) { setErr("errTel", "Ingresa un teléfono válido (mín. 8 dígitos)."); ok = false; }

      if (v("password").length < 6) { setErr("errPass", "Mínimo 6 caracteres."); ok = false; }
      if (v("password") !== v("password2")) { setErr("errPass2", "Las contraseñas no coinciden."); ok = false; }

      if (ok) {
        const res = await window.Store.Auth.register({
          nombre: v("nombre"), apellido: v("apellido"),
          email: v("email"), password: v("password"), telefono: v("telefono")
        });
        if (!res.ok) { setErr("errEmail", res.error); return; }
        window.Store.showToast("✓ ¡Registro exitoso! Ya puedes iniciar sesión");
        setTimeout(() => (window.location.href = "login.html"), 1400);
      }
    });
  </script>
</body>
</html>
