<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Inicia sesión en TecnoShop." />
  <title>Iniciar Sesión | TecnoShop</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Google Identity Services (iniciar sesión con Google) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body data-page="login">
  <div data-include="header"></div>

  <main class="container">
    <div class="auth-wrap">
      <form class="auth-card" id="loginForm" novalidate>
        <h1>Iniciar Sesión</h1>
        <p class="sub">Bienvenido de vuelta a TecnoShop</p>

        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="tucorreo@ejemplo.com" />
          <span class="error" id="errEmail"></span>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" />
          <span class="error" id="errPass"></span>
        </div>

        <button type="submit" class="btn btn--primary btn--block">Entrar</button>

        <div class="auth-divider"><span>o</span></div>
        <div id="googleBtn" class="google-btn"></div>

        <p class="auth-foot">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        <p class="auth-foot" style="font-size:.8rem">Demo admin: <strong>admin@tecnoshop.cl</strong> / <strong>admin123</strong></p>
      </form>
    </div>
  </main>

  <div data-include="footer"></div>

  <script src="js/products.js"></script>
  <script src="js/store.js"></script>
  <script src="js/google-auth.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email");
      const pass = document.getElementById("password");
      const errEmail = document.getElementById("errEmail");
      const errPass = document.getElementById("errPass");
      let ok = true;

      const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRe.test(email.value.trim())) {
        errEmail.textContent = "Ingresa un correo válido.";
        ok = false;
      } else { errEmail.textContent = ""; }

      if (pass.value.length < 6) {
        errPass.textContent = "La contraseña debe tener al menos 6 caracteres.";
        ok = false;
      } else { errPass.textContent = ""; }

      if (ok) {
        const res = window.Store.Auth.login(email.value, pass.value);
        if (!res.ok) { errPass.textContent = res.error; return; }
        localStorage.setItem("tecnoshop_welcome", res.user.nombre);
        const dest = res.user.role === "admin" ? "admin.html" : "index.html";
        setTimeout(() => (window.location.href = dest), 400);
      }
    });
  </script>
</body>
</html>
