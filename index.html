<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TecnoShop - Tienda de tecnología y artículos gamer: celulares, audio, gamer y más con envío gratis y cuotas." />
  <title>TecnoShop | Tecnología y Gaming al mejor precio</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body data-page="home">
  <div data-include="header"></div>

  <!-- Banner principal -->
  <section class="ml-banner">
    <div class="container ml-banner__inner">
      <div class="ml-banner__content">
        <p class="ml-banner__tag">⚡ Ofertas de la semana</p>
        <h1 class="ml-banner__title">Hasta <span>30% OFF</span> en tecnología y gaming</h1>
        <p class="ml-banner__text">Celulares, audio premium y periféricos gamer. Envío gratis y hasta 12 cuotas sin interés.</p>
        <div class="ml-banner__cta">
          <a href="productos.html?cat=all" class="btn btn--primary">Ver ofertas</a>
          <a href="productos.html" class="btn btn--outline">Todo el catálogo</a>
        </div>
      </div>
      <div class="ml-banner__art" aria-hidden="true">
        <div class="ml-banner__emoji">🎮</div>
      </div>
    </div>
  </section>

  <main class="container">
    <!-- Accesos de categorías -->
    <div class="cat-circles" id="catCircles"></div>

    <!-- Ofertas -->
    <section class="block">
      <h2 class="section-title">🔥 Ofertas del día</h2>
      <div class="products" id="ofertasGrid"></div>
    </section>

    <!-- Más vendidos -->
    <section class="block">
      <h2 class="section-title">⭐ Los más vendidos</h2>
      <div class="products" id="vendidosGrid"></div>
      <div style="text-align:center; margin-top:26px">
        <a href="productos.html" class="btn btn--outline">Ver todo el catálogo</a>
      </div>
    </section>
  </main>

  <div data-include="footer"></div>

  <script src="js/products.js"></script>
  <script src="js/store.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
