<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Catálogo completo de productos TecnoGamer." />
  <title>Productos | TecnoGamer</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body data-page="productos">
  <div data-include="header"></div>

  <main class="container block">
    <h2 class="section-title">Catálogo de Productos</h2>

    <div class="toolbar">
      <div class="filters" id="filters">
        <button class="chip active" data-filter="all">Todos</button>
        <button class="chip" data-filter="smartphones">Smartphones</button>
        <button class="chip" data-filter="gamer">Gamer</button>
        <button class="chip" data-filter="audio">Audio</button>
      </div>
      <div class="tools">
        <input type="search" id="searchInput" class="input" placeholder="Buscar producto..." aria-label="Buscar" />
        <select id="sortSelect" class="select" aria-label="Ordenar">
          <option value="default">Ordenar por</option>
          <option value="price-asc">Precio: menor a mayor</option>
          <option value="price-desc">Precio: mayor a menor</option>
          <option value="name">Nombre A-Z</option>
        </select>
      </div>
    </div>

    <div class="products" id="products"></div>
    <p class="empty-msg" id="emptyMsg" hidden>No se encontraron productos 😕</p>
  </main>

  <div data-include="footer"></div>

  <script src="js/products.js"></script>
  <script src="js/store.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
